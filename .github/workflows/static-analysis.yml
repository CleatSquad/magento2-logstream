---
name: Code style and static analysis

on:
  pull_request:
  push:
    branches: [master]

jobs:
  setup-deps:
    name: Prepare dependencies
    runs-on: ubuntu-latest

    # TON IMAGE UTILISÉE COMME ENVIRONNEMENT
    container:
      image: mohelmrabet/magento-frankenphp:php8.2-fp1.10.1-dev

    outputs:
      php-version: 8.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TON IMAGE A DÉJÀ PHP → pas besoin setup-php
      - name: PHP Version
        run: php -v

      - name: Create Composer auth directory
        run: mkdir -p "$HOME/.composer"

      - name: Create auth.json
        run: |
          printf '{"http-basic":{"repo.magento.com":{"username":"%s","password":"%s"}}}' \
            "$MAGENTO_AUTH_USERNAME" "$MAGENTO_AUTH_PASSWORD" > auth.json
        env:
          MAGENTO_AUTH_USERNAME: ${{ secrets.MAGENTO_AUTH_USERNAME }}
          MAGENTO_AUTH_PASSWORD: ${{ secrets.MAGENTO_AUTH_PASSWORD }}

      - name: Install dependencies
        run: composer install --no-progress --no-interaction --prefer-dist --ignore-platform-reqs

      - name: Verify installation
        run: composer show

      # Fallback ACT → pas d'upload artifact
      - name: Save vendor locally for ACT
        if: ${{ env.ACT }}
        run: |
          mkdir -p /tmp/vendor-artifact
          cp -r vendor /tmp/vendor-artifact/vendor
          cp composer.lock /tmp/vendor-artifact/

      # GitHub seulement
      - name: Upload vendor and lock
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: |
            vendor
            composer.lock

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    container:
      image: mohelmrabet/magento-frankenphp:php8.2-fp1.10.1-dev

    needs: setup-deps

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ACT fallback
      - name: Load vendor (ACT fallback)
        if: ${{ env.ACT }}
        run: |
          cp -r /tmp/vendor-artifact/vendor vendor
          cp /tmp/vendor-artifact/composer.lock composer.lock

      # GitHub only
      - name: Download vendor
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest

    container:
      image: mohelmrabet/magento-frankenphp:php8.2-fp1.10.1-dev

    needs: setup-deps

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ACT fallback
      - name: Load vendor (ACT fallback)
        if: ${{ env.ACT }}
        run: |
          cp -r /tmp/vendor-artifact/vendor vendor
          cp /tmp/vendor-artifact/composer.lock composer.lock

      # GitHub only
      - name: Download vendor
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor

      - name: Run PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --show-progress=none --dry-run
